# Builds, signs and publishes a release when a version tag (v0.1.0, ...) is pushed.
# The result is a DRAFT release: check it on GitHub, then press "Publish".
#
# Signing with SignPath (free for open source) turns on once these are set in the repository
# settings (see docs/CODE_SIGNING.md):
#   variable SIGNPATH_ORGANIZATION_ID, secret SIGNPATH_API_TOKEN
# Until then releases are built unsigned.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release
  actions: read # lets SignPath fetch the uploaded build artifacts

env:
  SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($version -ne $cargo) { throw "Tag v$version does not match version $cargo in Cargo.toml" }
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-pc-windows-msvc

      - name: Tests
        run: cargo test --workspace --release

      - name: Build x64 and ARM64
        run: |
          cargo build --release -p macaw --target x86_64-pc-windows-msvc
          cargo build --release -p macaw --target aarch64-pc-windows-msvc
          New-Item -ItemType Directory -Force dist/x64, dist/arm64 | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/macaw.exe dist/x64/
          Copy-Item target/aarch64-pc-windows-msvc/release/macaw.exe dist/arm64/

      - name: Upload the programs for signing
        id: upload-programs
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: programs
          path: |
            dist/x64/macaw.exe
            dist/arm64/macaw.exe

      - name: Sign the programs
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'macaw' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.upload-programs.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Build the installer
        run: |
          choco install innosetup --no-progress -y | Out-Null
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler (ISCC.exe) not found' }
          & $iscc.FullName "/DAppVersion=$env:VERSION" "/DDist=$PWD\dist" installer\macaw.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      - name: Upload the installer for signing
        id: upload-installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: installer
          path: dist/Macaw-*-setup.exe

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'macaw' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-installer.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Package and checksum
        run: |
          Compress-Archive dist/x64/macaw.exe "dist/Macaw-$env:VERSION-x64-portable.zip"
          Compress-Archive dist/arm64/macaw.exe "dist/Macaw-$env:VERSION-arm64-portable.zip"
          Get-ChildItem dist -File | Where-Object Name -ne 'SHA256SUMS.txt' |
            ForEach-Object { '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[?$([regex]::Escape($env:VERSION))\]?.*?$\r?\n(.*?)(?=^## |\z)").Groups[1].Value.Trim()
          $signing = if ($env:SIGNING -eq 'true') {
            'Free code signing provided by [SignPath.io](https://signpath.io), certificate by [SignPath Foundation](https://signpath.org).'
          } else {
            '> This build is not code-signed yet, so Windows SmartScreen may warn before it runs: choose **More info**, then **Run anyway**. Signed builds are on the way.'
          }
          # (In PowerShell a comma binds tighter than +, so build each line before making the list.)
          $download = '**Download:** `Macaw-{0}-setup.exe` (installer for x64 and ARM64 PCs), or a portable zip.' -f $env:VERSION
          $notes = @($section, '', $download, '', $signing, '', 'Checksums are in `SHA256SUMS.txt`.') -join "`n"
          Set-Content release-notes.md $notes
          gh release create $env:GITHUB_REF_NAME --draft --title "Macaw $env:VERSION" --notes-file release-notes.md `
            "dist/Macaw-$env:VERSION-setup.exe" "dist/Macaw-$env:VERSION-x64-portable.zip" "dist/Macaw-$env:VERSION-arm64-portable.zip" dist/SHA256SUMS.txt
